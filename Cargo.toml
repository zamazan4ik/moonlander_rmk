[package]
name = "rmk-zsa-moonlander"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = ["vial", "storage", "watchdog"] }

embassy-stm32 = { version = "0.6", features = [
    "stm32f303cb",
    "time-driver-tim15",
    "exti",
    "unstable-pac",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-sync = "0.8"

rmk-palettefx = { version = "0.1.0", optional = true }

cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"

panic-halt = "1.0"

[features]
default = ["palettefx"]
palettefx = ["dep:rmk-palettefx"]
# Recovery image only: resets saved key assignments on every boot.
reset-layout = []

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "rmk-zsa-moonlander"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = "s"
overflow-checks = true
lto = "fat"
panic = "unwind"

[profile.release]
codegen-units = 1
debug = false
panic = "abort"
opt-level = "z"
overflow-checks = false
lto = "fat"
